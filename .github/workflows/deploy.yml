# Deploys VeSessionManager (Worker + Web) to the production Ubuntu server over Tailscale.
#
# Trigger: pushing a version tag (v*.*.*) -- never on every commit to main.
#
# Required repo secrets (see docs/deployment.md for setup):
#   TS_OAUTH_CLIENT_ID  - Tailscale OAuth client ID (tag:ci) -- same client already used by NcsScheduler
#   TS_OAUTH_SECRET     - Tailscale OAuth client secret
#   SSH_PRIVATE_KEY     - private half of the shared 'deploy' keypair (same as NcsScheduler)
#   DEPLOY_HOST         - server's Tailscale hostname/IP (e.g. myserver.tailXXXX.ts.net)
#   DEPLOY_USER         - deploy

name: Deploy

on:
  push:
    tags:
      - 'v*.*.*'

env:
  DEPLOY_PATH: /opt/vesessionmanager
  DB_PATH: /var/lib/vesessionmanager/vesessionmanager.db
  WORKER_SERVICE: vesessionmanager-worker
  WEB_SERVICE: vesessionmanager-web
  # Must match ASPNETCORE_URLS in the web systemd unit -- change this (and the unit file) if it
  # collides with anything else already running on the box (NcsScheduler already occupies 5000).
  WEB_PORT: 5100

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - run: dotnet restore

      - run: dotnet build --configuration Release --no-restore

      - run: dotnet test --configuration Release --no-build

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    # Needed by the Publish release step below. Scoped to this job rather than the workflow so
    # build-and-test keeps the default read-only token.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Publish Worker
        run: dotnet publish src/VeSessionManager.Worker/VeSessionManager.Worker.csproj -c Release -o publish/worker -p:InformationalVersion=${{ github.ref_name }}

      - name: Publish Web
        run: dotnet publish src/VeSessionManager.Web/VeSessionManager.Web.csproj -c Release -o publish/web -p:InformationalVersion=${{ github.ref_name }}

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Backup database
        # rsync --ignore-missing-args, not cp: on a brand-new server the database does not exist yet
        # (the operator creates /var/lib/vesessionmanager, but the .db file itself is created by
        # Database.Migrate() the first time a service starts), so an unconditional cp made the very
        # FIRST deploy to any box fail here — before stopping services or syncing anything. Found on
        # the first real deploy, 2026-08-04; it would have hit the production server too.
        #
        # Guarding with `test -f` is NOT an option, in either form: `sudo test` is not in the deploy
        # user's sudoers allowlist, and an unprivileged `test -f` cannot read
        # /var/lib/vesessionmanager at all — so it would report "missing" even once the database
        # exists, silently skipping every backup from then on. That is far worse than the failure it
        # would be replacing.
        #
        # rsync is already permitted by that same allowlist (`/usr/bin/rsync *`), copies normally
        # when the file is there, and is a clean no-op when it is not. A genuine failure (bad
        # permissions, disk full) still fails the deploy, which is the property worth keeping.
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "sudo rsync --ignore-missing-args '$DB_PATH' '$DB_PATH.bak-\$(date +%Y%m%d%H%M%S)'"

      - name: Stop services
        # One service per command, deliberately. The deploy user's sudoers allowlist grants each
        # unit its own rule ("systemctl stop vesessionmanager-worker", "systemctl stop
        # vesessionmanager-web"), and sudo matches the WHOLE command line — so the combined
        # "systemctl stop web worker" form this used to run matched neither rule and was rejected
        # with "sudo: a password is required", which reads like a broken SSH key rather than an
        # allowlist miss. Found on the first real deploy, 2026-08-04.
        #
        # Keep these split if the allowlist stays per-unit; widening sudoers to "systemctl stop *"
        # would be the wrong trade, since the narrow rules are what stop a compromised deploy key
        # from touching anything else on the box. Web stops first so it stops serving before the
        # Worker goes down.
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "sudo systemctl stop $WEB_SERVICE && sudo systemctl stop $WORKER_SERVICE"

      - name: Sync Worker files
        run: |
          # deploy isn't the owner of the existing vesessionmanager-owned files, so it can't
          # reliably delete/overwrite/chown/chmod them as itself. --rsync-path runs the remote-side
          # rsync as root (via a narrowly-scoped NOPASSWD sudo rule) so it can freely write, delete,
          # and set final ownership via --chown. *.db* is excluded defensively even though the DB
          # actually lives outside this tree entirely, at $DB_PATH.
          rsync -avz --delete \
            --rsync-path="sudo rsync" \
            --chown=vesessionmanager:vesessionmanager \
            --exclude '*.db' \
            --exclude '*.db-shm' \
            --exclude '*.db-wal' \
            --exclude '*.bak-*' \
            -e "ssh -i ~/.ssh/deploy_key" \
            publish/worker/ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:$DEPLOY_PATH/worker/"

      - name: Sync Web files
        run: |
          rsync -avz --delete \
            --rsync-path="sudo rsync" \
            --chown=vesessionmanager:vesessionmanager \
            --exclude '*.db' \
            --exclude '*.db-shm' \
            --exclude '*.db-wal' \
            --exclude '*.bak-*' \
            -e "ssh -i ~/.ssh/deploy_key" \
            publish/web/ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:$DEPLOY_PATH/web/"

      - name: Start Worker, confirm it's healthy before starting Web
        run: |
          # Worker and Web both call dbContext.Database.Migrate() on startup (see Program.cs in
          # each project) -- starting them serially and confirming Worker is actually up first
          # avoids both processes racing to apply the same SQLite migration concurrently.
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "
            sudo systemctl start $WORKER_SERVICE
            sleep 5
            if ! systemctl is-active --quiet $WORKER_SERVICE; then
              echo 'Worker failed to start (possibly a migration or startup error); recent logs:'
              sudo journalctl -u $WORKER_SERVICE -n 50 --no-pager
              exit 1
            fi
          "

      - name: Start Web
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "sudo systemctl start $WEB_SERVICE"

      - name: Health check
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "
            for i in \$(seq 1 30); do
              code=\$(curl -s -o /dev/null -w '%{http_code}' http://localhost:$WEB_PORT/)
              if [ \"\$code\" != \"000\" ]; then
                echo \"Web responded with HTTP \$code\"
                exit 0
              fi
              sleep 3
            done
            echo 'Web failed to respond within 90s; recent logs:'
            sudo journalctl -u $WEB_SERVICE -n 50 --no-pager
            exit 1
          "

      # Everything below runs only once the deploy is proven good. A release is a claim that this
      # version works somewhere, so publishing one for a failed deploy would be worse than
      # publishing nothing -- which is why this sits after the health check rather than next to the
      # publish steps that produced the binaries.
      - name: Package binaries
        run: |
          mkdir -p artifacts
          (cd publish/worker && zip -qr ../../artifacts/vesessionmanager-worker-${{ github.ref_name }}.zip .)
          (cd publish/web    && zip -qr ../../artifacts/vesessionmanager-web-${{ github.ref_name }}.zip .)
          ls -lh artifacts

      # Notes come from the annotated tag message, which is where the release notes for this repo
      # are already written -- see the v0.2.x tags. --verify-tag refuses to invent a release for a
      # tag that does not exist, and the || branch makes a re-run of an already-released tag upload
      # the assets again instead of failing the whole deploy after it has already succeeded.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "Release ${{ github.ref_name }} already exists -- updating its assets."
            gh release upload "${{ github.ref_name }}" artifacts/* --clobber
          else
            gh release create "${{ github.ref_name }}" \
              --title "${{ github.ref_name }}" \
              --notes-from-tag \
              --verify-tag \
              artifacts/*
          fi
