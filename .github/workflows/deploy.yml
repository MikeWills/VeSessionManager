# Deploys VeSessionManager (Worker + Web) to the production Ubuntu server over Tailscale.
#
# Trigger: pushing a version tag (v*.*.*) -- never on every commit to main.
#
# Required repo secrets (see docs/deployment.md for setup):
#   TS_OAUTH_CLIENT_ID  - Tailscale OAuth client ID (tag:ci) -- same client already used by NcsScheduler
#   TS_OAUTH_SECRET     - Tailscale OAuth client secret
#   SSH_PRIVATE_KEY     - private half of the shared 'deploy' keypair (same as NcsScheduler)
#   DEPLOY_HOST         - server's Tailscale hostname/IP (e.g. myserver.tailXXXX.ts.net)
#   DEPLOY_USER         - deploy

name: Deploy

on:
  push:
    tags:
      - 'v*.*.*'

env:
  DEPLOY_PATH: /opt/vesessionmanager
  DB_PATH: /var/lib/vesessionmanager/vesessionmanager.db
  # Deliberately NOT under /var/lib/vesessionmanager -- see docs/deployment.md. The key ring and the
  # ciphertext it opens must not end up in one archive, so the two backups below stay in separate
  # directories rather than one tidy bundle.
  KEYRING_PATH: /var/lib/vesessionmanager-keys
  WORKER_SERVICE: vesessionmanager-worker
  WEB_SERVICE: vesessionmanager-web
  # Must match ASPNETCORE_URLS in the web systemd unit -- change this (and the unit file) if it
  # collides with anything else already running on the box (NcsScheduler already occupies 5000).
  WEB_PORT: 5100

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - run: dotnet restore

      - run: dotnet build --configuration Release --no-restore

      - run: dotnet test --configuration Release --no-build

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    # Needed by the Publish release step below. Scoped to this job rather than the workflow so
    # build-and-test keeps the default read-only token.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Publish Worker
        run: dotnet publish src/VeSessionManager.Worker/VeSessionManager.Worker.csproj -c Release -o publish/worker -p:InformationalVersion=${{ github.ref_name }}

      - name: Publish Web
        run: dotnet publish src/VeSessionManager.Web/VeSessionManager.Web.csproj -c Release -o publish/web -p:InformationalVersion=${{ github.ref_name }}

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Backup Data Protection key ring
        # Losing the key ring while the database survives makes every stored team credential
        # permanently unrecoverable, so it earns the same pre-deploy snapshot the database gets.
        #
        # The snapshot stays INSIDE $KEYRING_PATH rather than next to the database on purpose. A
        # backup that puts the key ring beside the ciphertext undoes the reason the two directories
        # were separated at all (#157) -- one leaked archive would then carry both halves.
        #
        # A server-side helper rather than `sudo rsync` (#254). The old form needed a sudoers rule
        # of `/usr/bin/rsync *`, and an unconstrained wildcard on rsync is root-equivalent — it can
        # read or overwrite any file on the box, and --rsync-path/-e can execute commands. That made
        # the narrow systemctl rules beside it decorative. The helper takes no arguments and hardcodes
        # every path, so its sudoers entry needs no wildcard.
        #
        # It handles the cases the flags used to: a box with no key ring yet is a clean no-op rather
        # than a failed deploy, and it copies *.xml at one level down so a snapshot can never include
        # a previous snapshot (#268 — the destination is a SUBDIRECTORY of the source, so a recursive
        # copy grew 2^n after n deploys). That property is structural now instead of a flag to
        # remember.
        #
        # NOTE: this is a rollback snapshot, not a backup. It lives on the same disk as the thing it
        # protects. Real off-box backup of $KEYRING_PATH is still a manual, separate job -- see
        # docs/deployment.md and #256.
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "sudo /usr/local/sbin/vesessionmanager-backup-keyring"

      - name: Stop services
        # One service per command, deliberately. The deploy user's sudoers allowlist grants each
        # unit its own rule ("systemctl stop vesessionmanager-worker", "systemctl stop
        # vesessionmanager-web"), and sudo matches the WHOLE command line — so the combined
        # "systemctl stop web worker" form this used to run matched neither rule and was rejected
        # with "sudo: a password is required", which reads like a broken SSH key rather than an
        # allowlist miss. Found on the first real deploy, 2026-08-04.
        #
        # Keep these split: the allowlist is per-unit and has no wildcards at all (#254). Widening
        # sudoers to "systemctl stop *"
        # would be the wrong trade, since the narrow rules are what stop a compromised deploy key
        # from touching anything else on the box. Web stops first so it stops serving before the
        # Worker goes down.
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "sudo systemctl stop $WEB_SERVICE && sudo systemctl stop $WORKER_SERVICE"

      - name: Backup database
        # **Runs AFTER the services stop, and copies -wal/-shm too. Both halves are the fix for #255.**
        #
        # The database is in WAL mode — EF Core enables it on databases it creates, and journal mode
        # is persisted in the file header. BACKUP.md asserted the opposite ("rollback-journal mode,
        # not WAL, nothing sets PRAGMA journal_mode"): the second half is true and the conclusion is
        # not. In WAL mode committed transactions live in the -wal file until checkpoint, so the
        # .db-only copy this used to take was MISSING every transaction since the last checkpoint —
        # and it opens cleanly, so the loss was silent.
        #
        # Taking it after the stop is what makes a plain file copy correct: nothing is writing, so
        # the three files are mutually consistent. Before the stop they were not, and adding -wal
        # alone would have traded silent loss for a torn copy.
        #
        # A server-side helper rather than `sudo rsync` — see the key ring step and #254 for why the
        # `/usr/bin/rsync *` sudoers rule this replaced was root-equivalent.
        #
        # The helper keeps every property the flags used to carry. Missing files are skipped rather
        # than failing: a cleanly checkpointed database has no -wal or -shm, and on a brand-new server
        # the .db itself does not exist until a service first runs Database.Migrate() — an
        # unconditional cp made the very FIRST deploy to any box fail here (found 2026-08-04).
        # Guarding with `test -f` from this side was never an option in either form: `sudo test` is
        # not allowlisted, and an unprivileged `test -f` cannot read /var/lib/vesessionmanager at all,
        # so it would report "missing" forever once the database existed. Inside the helper, running
        # as root, it is just an `if`.
        #
        # It also stamps all three files once, so the set shares a suffix and can be restored
        # together — previously done on the runner for the same reason.
        #
        # `sqlite3 '.backup'` / VACUUM INTO would be better still — one consistent file, no ordering
        # constraint. That is now a change to the helper rather than a new sudoers grant, which is
        # worth doing when #256 (real off-box backup) is built.
        #
        # NOTE: this is a rollback snapshot, not a backup. It lives on the same disk as the thing it
        # protects — see #256.
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "sudo /usr/local/sbin/vesessionmanager-backup-db"

      - name: Sync Worker files
        run: |
          # No sudo here at all (#254). $DEPLOY_PATH is owned by the deploy user with the
          # vesessionmanager group and setgid directories, so deploy can write, delete and replace
          # these files as itself while the service account reads them through the group. That is
          # what let `--rsync-path="sudo rsync"` go, and with it the `/usr/bin/rsync *` sudoers rule
          # that made every other rule on the box decorative.
          #
          # --chown went with it: setting ownership needs root, and is no longer wanted — the files
          # SHOULD be owned by deploy. The service only ever reads them. The one thing it writes
          # under this tree is Serilog's relative "logs/" path, which is owned by the service account
          # and excluded below.
          #
          # *.db* is excluded defensively even though the DB actually lives outside this tree
          # entirely, at $DB_PATH.
          #
          # 'logs' is NOT defensive — Serilog writes to a relative "logs/" path, so it resolves under
          # WorkingDirectory, i.e. inside this tree. Without the exclude, --delete removed the entire
          # log history on every deploy: the change window is exactly when it is most wanted, and a
          # bad release or a compromise noticed afterwards had no application-side evidence left
          # (#267). journalctl retains the console sink, which softened it but does not replace it.
          rsync -avz --delete \
            --exclude '*.db' \
            --exclude '*.db-shm' \
            --exclude '*.db-wal' \
            --exclude '*.bak-*' \
            --exclude 'logs' \
            -e "ssh -i ~/.ssh/deploy_key" \
            publish/worker/ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:$DEPLOY_PATH/worker/"

      - name: Sync Web files
        run: |
          rsync -avz --delete \
            --exclude '*.db' \
            --exclude '*.db-shm' \
            --exclude '*.db-wal' \
            --exclude '*.bak-*' \
            --exclude 'logs' \
            -e "ssh -i ~/.ssh/deploy_key" \
            publish/web/ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:$DEPLOY_PATH/web/"

      - name: Start Worker, confirm it's healthy before starting Web
        run: |
          # Worker and Web both call dbContext.Database.Migrate() on startup (see Program.cs in
          # each project) -- starting them serially and confirming Worker is actually up first
          # avoids both processes racing to apply the same SQLite migration concurrently.
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "
            sudo systemctl start $WORKER_SERVICE
            sleep 5
            if ! systemctl is-active --quiet $WORKER_SERVICE; then
              echo 'Worker failed to start (possibly a migration or startup error); recent logs:'
              sudo journalctl -u $WORKER_SERVICE -n 50 --no-pager
              exit 1
            fi
          "

      - name: Start Web
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "sudo systemctl start $WEB_SERVICE"

      - name: Health check
        # Asserts on the status code, not merely on having received one.
        #
        # This used to accept anything other than curl's 000 ("no response at all"), so a 400, a 404
        # or a 500 on every request all counted as a healthy deploy -- it proved the process was bound
        # to the port and nothing more, and the release below was published on the strength of it.
        #
        # It was almost certainly passing on a 400 in practice: AllowedHosts is pinned in
        # appsettings.Production.json, and a request to http://localhost:PORT/ carries Host: localhost,
        # which host-filtering middleware rejects with 400 before the request ever reaches the app. So
        # the reassuring "Web responded with HTTP 400" line was the check working as written.
        #
        # The Host header is taken from AllowedHosts itself rather than restated here, so the two
        # cannot drift; AllowedHosts may be a semicolon-separated list, hence the cut. Requesting
        # localhost with the right Host header tests the app directly, deliberately bypassing Apache
        # and TLS -- proxy problems are a different failure with a different fix.
        #
        # 2xx and 3xx both pass: "/" is public today and returns 200, but a redirect to the login page
        # would equally prove the app is processing requests, which is what this step is for. 4xx/5xx
        # fail. A response that is merely absent keeps the loop waiting, since the service may still be
        # starting.
        run: |
          PUBLIC_HOST=$(grep -oP '"AllowedHosts"\s*:\s*"\K[^"]+' \
            src/VeSessionManager.Web/appsettings.Production.json | cut -d';' -f1)
          if [ -z "$PUBLIC_HOST" ]; then
            echo "Could not read AllowedHosts from appsettings.Production.json — refusing to guess."
            exit 1
          fi
          echo "Health-checking as Host: $PUBLIC_HOST"
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "
            last=000
            for i in \$(seq 1 30); do
              last=\$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: $PUBLIC_HOST' http://localhost:$WEB_PORT/)
              case \"\$last\" in
                2*|3*)
                  echo \"Web healthy — HTTP \$last\"
                  exit 0
                  ;;
              esac
              sleep 3
            done
            if [ \"\$last\" = '000' ]; then
              echo 'Web never responded within 90s.'
            else
              echo \"Web responded with HTTP \$last — the process is up but not serving successfully.\"
            fi
            echo 'Recent logs:'
            sudo journalctl -u $WEB_SERVICE -n 50 --no-pager
            exit 1
          "

      # Everything below runs only once the deploy is proven good. A release is a claim that this
      # version works somewhere, so publishing one for a failed deploy would be worse than
      # publishing nothing -- which is why this sits after the health check rather than next to the
      # publish steps that produced the binaries.
      - name: Package binaries
        run: |
          mkdir -p artifacts
          (cd publish/worker && zip -qr ../../artifacts/vesessionmanager-worker-${{ github.ref_name }}.zip .)
          (cd publish/web    && zip -qr ../../artifacts/vesessionmanager-web-${{ github.ref_name }}.zip .)
          ls -lh artifacts

      # Notes come from the annotated tag message, which is where the release notes for this repo
      # are already written -- see the v0.2.x tags. --verify-tag refuses to invent a release for a
      # tag that does not exist, and the || branch makes a re-run of an already-released tag upload
      # the assets again instead of failing the whole deploy after it has already succeeded.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "Release ${{ github.ref_name }} already exists -- updating its assets."
            gh release upload "${{ github.ref_name }}" artifacts/* --clobber
          else
            gh release create "${{ github.ref_name }}" \
              --title "${{ github.ref_name }}" \
              --notes-from-tag \
              --verify-tag \
              artifacts/*
          fi
